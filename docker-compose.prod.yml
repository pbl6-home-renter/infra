version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "15672:15672"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-api.example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rentify-net
    # depends_on:
    #   - identity

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - ./env/rabbitmq.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rentify-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # identity:
  #   image: ${DOCKERHUB_USERNAME:-rentify}/rentify-identity:${IMAGE_TAG:-latest}
  #   container_name: identity
  #   restart: unless-stopped
  #   env_file:
  #     - ./env/identity.env
  #   networks:
  #     - rentify-net
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy

networks:
  rentify-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  rabbitmq_data:
