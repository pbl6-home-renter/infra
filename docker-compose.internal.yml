services:
  identity:
    image: ${IDENTITY_IMAGE:-baocules/identity-service}:${IMAGE_TAG:-latest}
    container_name: identity
    restart: unless-stopped
    env_file:
      - ./env/identity.env
    ports:
      - "3001:3001"
    networks:
      - rentify-internal

  tenancy:
    image: ${TENANCY_IMAGE:-baocules/tenancy-service}:${IMAGE_TAG:-latest}
    container_name: tenancy
    restart: unless-stopped
    env_file:
      - ./env/tenancy.env
    ports:
      - "3002:3002"
    networks:
      - rentify-internal
    depends_on:
      identity:
        condition: service_started

