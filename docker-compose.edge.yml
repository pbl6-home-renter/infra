services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:5173"
      - "15672:15672"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rentify-edge
    depends_on:
      api-gateway:
        condition: service_started
      web:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  api-gateway:
    image: ${DOCKERHUB_USERNAME:-baocules}/api-gateway:${IMAGE_TAG:-latest}
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - ./env/api-gateway.env
    expose:
      - "3000"
    networks:
      - rentify-edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: ${DOCKERHUB_USERNAME:-baocules}/pbl6-web:${IMAGE_TAG:-latest}
    container_name: web
    restart: unless-stopped
    expose:
      - "5173"
    networks:
      - rentify-edge

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
    expose:
      - "5672"
      - "15672"
    env_file:
      - ./env/rabbitmq.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rentify-edge
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  rentify-edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  rabbitmq_data:
